        /* RESET & BASE RULES */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-stack-modern);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a1014;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* SCROLLBAR ENGINE */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        svg {
            fill: currentColor;
            display: inline-block;
            vertical-align: middle;
        }

        /* 
        =======================================================================
        MODULE 3: ACCESSIBLE COMPONENT RESET & ONBOARDING SYSTEM UI
        =======================================================================
        */
        #onboarding-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--wa-panel-bg);
            padding: 45px 40px;
            border-radius: 16px;
            width: 460px;
            max-width: 95%;
            box-shadow: var(--box-shadow-heavy);
            border-top: 6px solid var(--wa-teal-primary);
            text-align: center;
            z-index: var(--layer-popover);
            position: absolute;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), filter 1s ease, opacity 0.8s ease;
            backdrop-filter: blur(10px);
        }

        #onboarding-screen.shattered {
            transform: scale(0.85) translateY(-60px);
            filter: blur(20px);
            opacity: 0;
            pointer-events: none;
        }

        .wa-pulsing-logo {
            width: 80px;
            height: 80px;
            color: var(--wa-teal-primary);
            margin-bottom: 25px;
            animation: ambientFloat 4s ease-in-out infinite;
        }

        @keyframes ambientFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .avatar-uploader {
            position: relative;
            margin-bottom: 30px;
            cursor: pointer;
            width: 130px;
            height: 130px;
        }

        .avatar-frame {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--wa-dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px dashed var(--text-muted);
            font-size: 13px;
            color: var(--text-muted);
            transition: all var(--transition-speed-normal) ease;
        }

        .avatar-uploader:hover .avatar-frame {
            border-color: var(--wa-teal-primary);
            color: var(--wa-teal-primary);
            background: rgba(0, 168, 132, 0.05);
        }

        .avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .wa-input {
            width: 100%;
            padding: 14px 20px;
            background: var(--input-field-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
        }

        .wa-input:focus {
            border-color: var(--wa-teal-primary);
        }

        .wa-btn {
            width: 100%;
            padding: 14px 24px;
            background: var(--wa-teal-primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition-speed-fast) ease;

        /* LOADING LAYER OVERLAY */
        .mojang-overlay {

justify-content: center;
align-items: center;

opacity: 0;
pointer-events: none;

}
.engine-progress {

transition: width 0.1s linear;

*/

height: 100%;
}

}

}

}

transition: all var(--transition-speed-fast) ease;
}
.tab-node.active {

}
/*
=======================================================================
MODULE 5: FRIEND DISCOVERY & MANAGEMENT SUB-SYSTEM
=======================================================================
*/

flex: 1;

}

}
/* ROSTER DESIGN MATRICES */
.chat-list-row {
padding: 12px 16px;

align-items: center;
gap: 14px;

}
.chat-list-row:hover { background: var(--wa-panel-bg); }
.chat-list-row.active { background: var(--input-field-bg); }
.avatar-wrapper {
position: relative;

height: 48px;
flex-shrink: 0;
}
.avatar-wrapper .node-pic {
width: 100%; height: 100%;
border-radius: 50%; object-fit: cover;

}
.presence-dot {
position: absolute;

}

.row-name { font-weight: 500; font-size: 15px; color: var(--text-main); }

}

flex: 1;

.wa-bubble {
max-width: 60%;

flex-direction: column;

.wa-bubble.sent {
background: var(--wa-bubble-out);
color: var(--wa-bubble-out-text);

.wa-bubble.received {

.wa-bubble img { max-width: 100%; border-radius: 6px; margin: 4px 0; display: block; }

background: var(--input-field-bg);

}
.recording-timer { font-size: 13px; color: var(--danger-red); font-weight: 700; font-family: monospace; }
.visualizer-canvas { flex: 1; height: 26px; }

.call-btn.hangup { background: var(--danger-red); }
.call-btn.answer { background: var(--wa-teal-primary); }

padding: 10px 14px;

const analyticFrequencyLength = analysisWaveformAnalyzer.frequencyBinCount;
const dataFrequencyMatrixArray = new Uint8Array(analyticFrequencyLength);

renderingFrameAnimationStream = requestAnimationFrame(drawFrame);
analysisWaveformAnalyzer.getByteFrequencyData(dataFrequencyMatrixArray);

let channelWidthStep = (visualCanvasElement.width / analyticFrequencyLength) * 2.0;
let stepHeightMetric;

graphicContext2D.fillRect(currentCoordinatesX, (visualCanvasElement.height - stepHeightMetric) / 2, channelWidthStep - 2, stepHeightMetric);

}
}

}
