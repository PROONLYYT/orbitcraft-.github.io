<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat Messenger Client Pro</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- External SDK Integrations -->
    <script src="https://google.com" async defer></script>

    <style>
        :root {
            /* Premium Glassmorphic Obsidian-Cyan Design Tokens */
            --bg-dark: #07090e;
            --bg-dark-gradient: linear-gradient(135deg, #07090e 0%, #0a1118 100%);
            --bg-panel: rgba(10, 20, 30, 0.65);
            --bg-sidebar: rgba(6, 10, 15, 0.85);
            --primary-accent: #00ffff;
            --primary-hover: #00cccc;
            --primary-glow: rgba(0, 255, 255, 0.4);
            --text-main: #f2f3f5;
            --text-muted: #8a9aa8;
            --danger-red: #ff3344;
            --danger-hover: #cc2233;
            --success-green: #00ff66;
            --border-subtle: rgba(0, 255, 255, 0.15);
            --border-active: rgba(0, 255, 255, 0.6);
            --input-bg: rgba(5, 10, 15, 0.8);
            --gold-accent: #f5a623;
            --pink-neon: #ff007f;
            
            /* UI Sizing Anchors */
            --nav-rail-width: 75px;
            --sidebar-width: 280px;

            /* Enhanced Layout Performance Constants */
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --glass-blur: blur(16px);
        }

        /* Global Structural Overrides & Reset Rules */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html, button, input, textarea, select {
            cursor: default;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            background-image: var(--bg-dark-gradient);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Scannable Scrollbar Elements */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-accent);
        }

        /* Utility Micro-Classes for Global Presentation Layouts */
        .unselectable {
            user-select: none;
            -webkit-user-select: none;
        }
        .glow-text {
            text-shadow: 0 0 12px var(--primary-glow);
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Cinematic Loading Portal Splash Overlay Styles */
        #splash-loading-portal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #04060a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s ease;
        }

        #splash-loading-portal.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .splash-logo-container {
            width: 90px;
            height: 90px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .splash-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: pulseLogo 2s ease-in-out infinite;
        }

        .splash-headline {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
            text-shadow: 0 0 16px rgba(0, 255, 255, 0.4);
        }

        .splash-user-subtitle {
            font-size: 15px;
            color: var(--primary-accent);
            font-weight: 600;
            margin-bottom: 30px;
            min-height: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .progress-track-wrapper {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.1);
            position: relative;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-hover), var(--primary-accent));
            box-shadow: 0 0 16px var(--primary-accent);
            transition: width 0.1s linear;
        }

        @keyframes pulseLogo {
            0%, 100% { 
                transform: scale(1); 
                filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.2)); 
            }
            50% { 
                transform: scale(1.08); 
                filter: drop-shadow(0 0 24px var(--primary-accent)); 
            }
        }

        /* Master Application Layout Window Frame */
        #app-frame {
            display: flex;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            transition: opacity 0.5s ease;
            background: var(--bg-dark-gradient);
        }

        #app-frame.visible {
            opacity: 1;
        }

        /* Vertical Global 5-Tab Rails Frame Layout */
        .global-nav-rail {
            width: var(--nav-rail-width);
            height: 100%;
            background: rgba(3, 6, 10, 0.95);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            z-index: 10;
        }

        /* Hover-Scale Tab Item Physics Core */
        .rail-tab-item {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer !important;
            color: var(--text-muted);
            font-size: 22px;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        background-color 0.2s ease, 
                        border-color 0.2s ease, 
                        color 0.2s ease, 
                        box-shadow 0.2s ease;
        }

        .rail-tab-item:hover {
            color: var(--primary-accent);
            background: rgba(0, 255, 255, 0.05);
            border-color: var(--primary-accent);
            transform: scale(1.15);
            box-shadow: 0 0 16px var(--primary-glow);
        }

        .rail-tab-item.active {
            color: #ffffff;
            background: var(--primary-hover);
            border-color: var(--primary-accent);
            box-shadow: 0 0 14px rgba(0, 255, 255, 0.35);
        }

        /* Standard Sub-context Left Sidebar panel */
        .sidebar-panel {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            height: 100%;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .sidebar-header {
            padding: 16px;
            background: rgba(15, 25, 35, 0.45);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            height: 70px;
        }

        .profile-node-area {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            width: 100%;
        }

        .user-tag-avatar {
            width: 38px;
            height: 38px;
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid var(--primary-accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-accent);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.25);
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .user-tag-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sidebar-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
        }

        .sidebar-tools {
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(5, 10, 15, 0.45);
            border-bottom: 1px solid var(--border-subtle);
        }

        .sm-btn {
            width: 100%;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            cursor: pointer !important;
            transition: var(--transition-smooth);
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
        }

        .sm-btn:hover {
            background: rgba(0, 255, 255, 0.08);
            border-color: var(--primary-accent);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.15);
        }

        .sm-btn.danger {
            background: rgba(255, 51, 68, 0.05);
            color: var(--danger-red);
            border-color: rgba(255, 51, 68, 0.25);
        }

        .sm-btn.danger:hover {
            background: var(--danger-red);
            border-color: var(--danger-red);
            color: white;
            box-shadow: 0 0 12px rgba(255, 51, 68, 0.35);
        }

        .shop-trigger-btn {
            width: 100%;
            padding: 12px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            background: transparent;
            color: var(--primary-accent);
            border: 1px solid var(--primary-accent);
            border-radius: 8px;
            cursor: pointer !important;
            transition: var(--transition-smooth);
            text-align: center;
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .shop-trigger-btn:hover {
            background: var(--primary-hover);
            color: #000000;
            box-shadow: 0 0 16px var(--primary-accent);
        }

        .contacts-vertical-stack {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chat-list-row {
            padding: 14px 16px;
            cursor: pointer !important;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.01);
            transition: var(--transition-smooth);
            border-left: 4px solid transparent;
        }

        .chat-list-row:hover, .chat-list-row.active {
            background: rgba(0, 255, 255, 0.04);
            border-left-color: var(--primary-accent);
        }

        .row-avatar {
            font-size: 14px;
            font-weight: 700;
            width: 34px;
            height: 34px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
            color: var(--text-muted);
            transition: var(--transition-smooth);
        }

        .chat-list-row:hover .row-avatar, .chat-list-row.active .row-avatar {
            color: var(--primary-accent);
            border-color: var(--primary-accent);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .row-meta {
            flex: 1;
            min-width: 0;
        }

        .row-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .row-preview {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .workspace-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            position: relative;
            height: 100%;
        }

        .workspace-header {
            padding: 14px 24px;
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            height: 70px;
            box-sizing: border-box;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .header-profile {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-profile .title {
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
        .thread-scroll-view {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-sizing: border-box;
        }

        .msg-bubble {
            max-width: 65%;
            padding: 12px 18px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            word-wrap: break-word;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            transition: var(--transition-smooth);
        }

        .msg-bubble.sent {
            background: rgba(0, 255, 255, 0.06);
            border-color: rgba(0, 255, 255, 0.35);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .msg-bubble.received {
            background: rgba(255, 255, 255, 0.02);
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        .msg-author {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-accent);
            margin-bottom: 4px;
            letter-spacing: 0.6px;
        }

        .msg-bubble.sent .msg-author {
            color: #ffffff;
        }

        .msg-footer {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 6px;
            align-self: flex-end;
            font-variant-numeric: tabular-nums;
        }

        .input-dock-bar {
            padding: 16px 24px;
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            gap: 14px;
            border-top: 1px solid var(--border-subtle);
            height: 75px;
            box-sizing: border-box;
            position: relative;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .input-dock-bar input[type="text"] {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            padding: 12px 18px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: var(--transition-smooth);
        }

        .input-dock-bar input[type="text"]:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .cooldown-progress-track {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: rgba(255, 255, 255, 0.01);
            pointer-events: none;
        }

        .cooldown-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-accent);
            box-shadow: 0 0 10px var(--primary-accent);
        }

        .emoji-trigger-node-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 18px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer !important;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-trigger-node-btn:hover {
            color: var(--primary-accent);
            border-color: var(--primary-accent);
            background: rgba(0, 255, 255, 0.06);
        }

        .emoji-picker-matrix-overlay {
            position: absolute;
            bottom: 85px;
            right: 24px;
            width: 330px;
            height: 260px;
            background: rgba(10, 16, 26, 0.96);
            border: 1px solid var(--border-active);
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            z-index: 1000;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .emoji-picker-header {
            padding: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-subtle);
            text-transform: uppercase;
        }

        .emoji-grid-scroller {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .emoji-grid-item-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            padding: 4px;
            border-radius: 6px;
            cursor: pointer !important;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .emoji-grid-item-cell:hover {
            background: rgba(0, 255, 255, 0.18);
            transform: scale(1.15);
        }
        .send-btn {
            background: transparent;
            color: var(--primary-accent);
            border: 1px solid var(--primary-accent);
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer !important;
            transition: var(--transition-smooth);
            box-shadow: 0 0 6px var(--primary-glow);
        }

        .send-btn:hover {
            background: var(--primary-hover);
            color: #000000;
            box-shadow: 0 0 14px var(--primary-accent);
        }

        .send-btn:disabled {
            border-color: var(--border-subtle);
            color: var(--text-muted);
            background: transparent;
            box-shadow: none;
            cursor: not-allowed !important;
        }

        .call-action-btn {
            background: transparent;
            border: 1px solid var(--primary-accent);
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-accent);
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer !important;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 6px var(--primary-glow);
        }

        .call-action-btn:hover {
            background: var(--primary-hover);
            color: #000000;
            box-shadow: 0 0 16px var(--primary-accent);
        }

        #call-interface-layer {
            display: none;
            flex-direction: column;
            background: rgba(4, 6, 10, 0.92);
            padding: 20px;
            border-bottom: 1px solid var(--border-subtle);
            box-sizing: border-box;
        }

        .media-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 280px;
        }

        @media (max-width: 768px) {
            .media-grid { grid-template-columns: 1fr; }
        }

        .media-window {
            background: var(--input-bg);
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            height: 280px;
            box-shadow: inset 0 0 24px rgba(0,0,0,0.8);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .media-window.speaking-active {
            border-color: var(--primary-accent) !important;
            box-shadow: 0 0 20px var(--primary-glow), inset 0 0 24px rgba(0, 255, 255, 0.15) !important;
        }

        .live-video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #000000;
        }

        .stream-canvas-mock {
            width: 100%;
            height: 100%;
            position: absolute;
            background: radial-gradient(circle, rgba(10,20,30,0.85) 0%, rgba(4,6,10,1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        .stream-label {
            position: absolute;
            bottom: 14px;
            left: 14px;
            background: rgba(4,6,10,0.85);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 11px;
            color: #ffffff;
            z-index: 3;
            font-weight: 600;
            border: 1px solid var(--border-subtle);
            border-left: 3px solid var(--primary-accent);
            letter-spacing: 0.6px;
        }

        .avatar-placeholder-call {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid var(--primary-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .avatar-placeholder-call img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .call-controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 16px;
            background: rgba(10, 20, 30, 0.5);
            padding: 12px 20px;
            border-radius: 10px;
            flex-wrap: wrap;
            border: 1px solid var(--border-subtle);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer !important;
            font-weight: 600;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-smooth);
        }

        .control-btn:hover {
            background: rgba(0, 255, 255, 0.06);
            border-color: var(--primary-accent);
            color: #ffffff;
        }

        .control-btn.active-state {
            background: rgba(255, 51, 68, 0.15);
            border-color: var(--danger-red);
            color: #ffffff;
        }

        .control-btn.active-state:hover {
            background: var(--danger-red);
            box-shadow: 0 0 12px rgba(255, 51, 68, 0.4);
        }

        .call-timer-node {
            color: var(--primary-accent);
            font-family: monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.5);

        /**
         * Handles JWT token structures dispatched by Google Ecosystem parameters
         */
        function handleCredentialResponse(response) {
            try {
                const base64Url = response.credential.split('.');
                const base64 = base64Url[1].replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const googleProfileObj = JSON.parse(jsonPayload);
                
                currentProfileSessionName = googleProfileObj.name.replace(/\s+/g, '');
                currentProfileAvatarUrl = googleProfileObj.picture || "";

                identityLinkingMatrix.google.connected = true;
                identityLinkingMatrix.google.name = googleProfileObj.name;
                identityLinkingMatrix.google.avatar = googleProfileObj.picture;

                localStorage.setItem('nexuschat_user_v6', currentProfileSessionName);
                if (currentProfileAvatarUrl) {
                    localStorage.setItem('nexuschat_avatar_v6', currentProfileAvatarUrl);
                }

                executeProfileUIRenderSync();

                const loginGate = document.getElementById('secure-login-gate-overlay');
                const splashPortal = document.getElementById('splash-loading-portal');
                
                if (loginGate) loginGate.classList.add('hidden');
                if (splashPortal) splashPortal.classList.remove('hidden');
                
                runCinematicProgressBar();
                
                appendBubbleElement("System Monitor", "Successfully linked genuine Google Account credential data container!", "received");
            } catch (err) {

            }
        }

function initiateMicrophoneAnalysisAudioEngine(streamObject) {
try {
initAudioContext();
localMicrophoneAudioSource = audioCtx.createMediaStreamSource(streamObject);
localAudioAnalyserNode = audioCtx.createAnalyser();
localAudioAnalyserNode.fftSize = 64;
localMicrophoneAudioSource.connect(localAudioAnalyserNode);
executeEqualizerRenderFrameLoop();
} catch (err) {
console.log("Audio visualizer node assignment error: ", err);
}
}
function executeEqualizerRenderFrameLoop() {
if (!localAudioAnalyserNode) return;
const bufferLen = localAudioAnalyserNode.frequencyBinCount;
const dataArray = new Uint8Array(bufferLen);
localAudioAnalyserNode.getByteFrequencyData(dataArray);
let frequencySum = 0;
for (let i = 0; i < bufferLen; i++) {
frequencySum += dataArray[i];
}
const averageVolume = frequencySum / bufferLen;
const targetContainer = document.getElementById('webcam-hardware-window-node');
if (targetContainer) {
if (averageVolume > 25) {
targetContainer.classList.add('speaking-active');
let dynamicGlowRadius = Math.min(30, Math.floor(averageVolume / 3));
targetContainer.style.boxShadow = 0 0 ${dynamicGlowRadius}px var(--primary-glow), inset 0 0 20px rgba(0, 255, 255, 0.15);
} else {
targetContainer.classList.remove('speaking-active');
targetContainer.style.boxShadow = '';
}
}
micAnimationRequestId = requestAnimationFrame(executeEqualizerRenderFrameLoop);
}
function haltMicrophoneAnalysisAudioEngine() {
if (micAnimationRequestId) cancelAnimationFrame(micAnimationRequestId);
const targetContainer = document.getElementById('webcam-hardware-window-node');
if (targetContainer) {
targetContainer.classList.remove('speaking-active');
targetContainer.style.boxShadow = '';
}
if (localMicrophoneAudioSource) localMicrophoneAudioSource.disconnect();
localAudioAnalyserNode = null;
localMicrophoneAudioSource = null;
}
async function toggleScreenShareState() {
const shareElement = document.getElementById('hardware-screenshare-stream');
const screenBtn = document.getElementById('screenshare-video-toggle');
const mockBox = document.getElementById('screenshare-canvas');
const label = document.getElementById('screenshare-label');
if (!shareElement || !screenBtn || !mockBox || !label) return;
if (!isCallActive) {
alert("Please enter the live call channel stream frame first.");
return;
}
isScreenSharing = !isScreenSharing;
playSynthFrequency(600, 'triangle', 0.1, 0.2);
if (isScreenSharing) {
try {
localHardwareDisplayStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
shareElement.srcObject = localHardwareDisplayStream;
shareElement.onloadedmetadata = () => {
shareElement.play().catch(e => console.log("Display canvas stream blocked: ", e));
};
mockBox.style.display = 'none';
screenBtn.innerText = "Stop Sharing";
screenBtn.classList.add('active-state');
label.innerText = "Display Canvas Sharing Live";
localHardwareDisplayStream.getVideoTracks()[0].onended = () => {
if (isScreenSharing) toggleScreenShareState();
};
} catch (err) {
console.error("Screen Share capture error: ", err);
isScreenSharing = false;
mockBox.style.display = 'flex';
}
} else {
if (localHardwareDisplayStream) {
localHardwareDisplayStream.getTracks().forEach(track => track.stop());
}
shareElement.srcObject = null;
mockBox.style.display = 'flex';
screenBtn.innerText = "Share Screen";
screenBtn.classList.remove('active-state');
label.innerText = "Screen Capture Pipe Offline";
}
}
function toggleMuteState() {
isAudioMuted = !isAudioMuted;
const muteBtn = document.getElementById('mute-audio-toggle');
if (!muteBtn) return;
if (localHardwareVideoStream) {
localHardwareVideoStream.getAudioTracks().forEach(track => {
track.enabled = !isAudioMuted;
});
}
if (isAudioMuted) {
muteBtn.innerText = "Audio Muted";
muteBtn.classList.add('active-state');
} else {
muteBtn.innerText = "Audio Unmuted";
muteBtn.classList.remove('active-state');
}
triggerToggleMuteTone(isAudioMuted);
}
function cleanupHardwareTracks() {
haltMicrophoneAnalysisAudioEngine();
if (localHardwareVideoStream) {
localHardwareVideoStream.getTracks().forEach(track => track.stop());
localHardwareVideoStream = null;
}
if (localHardwareDisplayStream) {
localHardwareDisplayStream.getTracks().forEach(track => track.stop());
localHardwareDisplayStream = null;
}
const webcamEl = document.getElementById('hardware-webcam-stream');
const screenEl = document.getElementById('hardware-screenshare-stream');
if (webcamEl) webcamEl.srcObject = null;
if (screenEl) screenEl.srcObject = null;
const webcamBox = document.getElementById('webcam-canvas');
const screenBox = document.getElementById('screenshare-canvas');
if (webcamBox) { webcamBox.style.display = 'flex'; webcamBox.style.opacity = "1"; }
if (screenBox) screenBox.style.display = 'flex';
isCameraActive = false;
isScreenSharing = false;
isAudioMuted = false;
const camBtn = document.getElementById('webcam-video-toggle');
const screenBtn = document.getElementById('screenshare-video-toggle');
const muteBtn = document.getElementById('mute-audio-toggle');
if (camBtn) camBtn.classList.remove('active-state');
if (screenBtn) screenBtn.classList.remove('active-state');
if (muteBtn) {
muteBtn.innerText = "Audio Unmuted";
muteBtn.classList.remove('active-state');
}
}
function initiateChronometerClock() {
elapsedCallSeconds = 0;
const durationClock = document.getElementById('call-duration-clock');
callTimerInterval = setInterval(() => {
elapsedCallSeconds++;
let displayMinutes = String(Math.floor(elapsedCallSeconds / 60)).padStart(2, '0');
let displaySeconds = String(elapsedCallSeconds % 60).padStart(2, '0');
if (durationClock) durationClock.innerText = ${displayMinutes}:${displaySeconds};
}, 1000);
}
function terminateChronometerClock() {
clearInterval(callTimerInterval);
const durationClock = document.getElementById('call-duration-clock');
if (durationClock) durationClock.innerText = "00:00";
}
