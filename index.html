<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web Pro Ultra - Production Workspace</title>
    <style>
        :root {
            --wa-teal-primary: #00a884;
            --wa-teal-hover: #008769;
            --wa-dark-bg: #111b21;
            --wa-panel-bg: #202c33;
            --wa-chat-bg: #0b141a;
            --wa-bubble-out: #005c4b;
            --wa-bubble-in: #202c33;
            --wa-bubble-out-text: #e9edef;
            --wa-bubble-in-text: #e9edef;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --text-link: #53bdeb;
            --danger-red: #ea0038;
            --danger-hover: #c2002f;
            --success-green: #00e676;
            --border-subtle: #222d34;
            --input-field-bg: #2a3942;
            --scrollbar-thumb: #374248;
            --scrollbar-thumb-hover: #4f5d64;
            --glass-panel-bg: rgba(32, 44, 51, 0.85);
            --transition-speed-fast: 0.15s;
            --transition-speed-normal: 0.3s;
            --transition-speed-cinematic: 0.8s;
            --box-shadow-ambient: 0 4px 20px rgba(0,0,0,0.4);
            --box-shadow-heavy: 0 16px 48px rgba(0,0,0,0.75);
            --avatar-fallback-bg: #2a3942;
            --visualizer-accent: #00ffcc;
            --font-stack-modern: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --layer-ground: 1;
            --layer-dock: 10;
            --layer-popover: 150;
            --layer-overlay: 500;
            --layer-loading: 1000;
        }

        body.theme-classic {
            --wa-teal-primary: #00a884;
            --wa-teal-hover: #008769;
            --wa-bubble-out: #005c4b;
            --wa-bubble-in: #202c33;
            --wa-dark-bg: #111b21;
            --wa-chat-bg: #0b141a;
            --wa-panel-bg: #202c33;
        }

        body.theme-midnight {
            --wa-teal-primary: #3f51b5;
            --wa-teal-hover: #303f9f;
            --wa-bubble-out: #1a237e;
            --wa-bubble-in: #1e2732;
            --wa-dark-bg: #0a0e17;
            --wa-chat-bg: #020408;
            --wa-panel-bg: #121824;
            --input-field-bg: #1c2638;
            --border-subtle: #1f2a3c;
            --scrollbar-thumb: #2c3b54;
            --scrollbar-thumb-hover: #3d5273;
            --text-main: #f0f4f8;
            --text-muted: #7e8c9a;
        }

        body.theme-ruby {
            --wa-teal-primary: #e91e63;
            --wa-teal-hover: #c2185b;
            --wa-bubble-out: #880e4f;
            --wa-bubble-in: #2a0b14;
            --wa-dark-bg: #1a050d;
            --wa-chat-bg: #0d0206;
            --wa-panel-bg: #2d0c18;
            --input-field-bg: #3d1424;
            --border-subtle: #4a1a2c;
            --scrollbar-thumb: #5c2037;
            --scrollbar-thumb-hover: #732946;
            --text-main: #ffebee;
            --text-muted: #b48a94;
        }

        body.theme-cyberpunk {
            --wa-teal-primary: #00ffcc;
            --wa-teal-hover: #00cc99;
            --wa-bubble-out: #004d3d;
            --wa-bubble-in: #1a0033;
            --text-main: #00ffcc;
            --wa-dark-bg: #120136;
            --wa-chat-bg: #03001e;
            --wa-panel-bg: #240046;
            --input-field-bg: #3c006f;
            --text-muted: #ff007f;
            --border-subtle: #ff007f;
            --scrollbar-thumb: #ff007f;
            --scrollbar-thumb-hover: #00ffcc;
            --wa-bubble-out-text: #ffffff;
            --wa-bubble-in-text: #00ffcc;
        }

        body.theme-monochrome {
            --wa-teal-primary: #ffffff;
            --wa-teal-hover: #cccccc;
            --wa-bubble-out: #333333;
            --wa-bubble-in: #1a1a1a;
            --wa-dark-bg: #0d0d0d;
            --wa-chat-bg: #050505;
            --wa-panel-bg: #141414;
            --input-field-bg: #222222;
            --border-subtle: #2b2b2b;
            --scrollbar-thumb: #444444;
            --scrollbar-thumb-hover: #666666;
            --text-muted: #aaaaaa;
            --text-main: #ffffff;
        }

        body.theme-matrix {
            --wa-teal-primary: #00ff00;
            --wa-teal-hover: #00cc00;
            --wa-bubble-out: #002200;
            --wa-bubble-in: #001100;
            --wa-dark-bg: #000000;
            --wa-chat-bg: #000000;
            --wa-panel-bg: #050505;
            --input-field-bg: #0a0a0a;
            --border-subtle: #00ff00;
            --text-main: #00ff00;
            --text-muted: #00aa00;
            --scrollbar-thumb: #00aa00;
            --scrollbar-thumb-hover: #00ff00;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-stack-modern);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a1014;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        svg {
            fill: currentColor;
            display: inline-block;
            vertical-align: middle;
        }
        #onboarding-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--wa-panel-bg);
            padding: 45px 40px;
            border-radius: 16px;
            width: 460px;
            max-width: 95%;
            box-shadow: var(--box-shadow-heavy);
            border-top: 6px solid var(--wa-teal-primary);
            text-align: center;
            z-index: var(--layer-popover);
            position: absolute;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), filter 1s ease, opacity 0.8s ease;
            backdrop-filter: blur(10px);
        }

        #onboarding-screen.shattered {
            transform: scale(0.85) translateY(-60px);
            filter: blur(20px);
            opacity: 0;
            pointer-events: none;
        }

        .wa-pulsing-logo {
            width: 80px;
            height: 80px;
            color: var(--wa-teal-primary);
            margin-bottom: 25px;
            animation: ambientFloat 4s ease-in-out infinite;
        }

        @keyframes ambientFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .avatar-uploader {
            position: relative;
            margin-bottom: 30px;
            cursor: pointer;
            width: 130px;
            height: 130px;
        }

        .avatar-frame {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--wa-dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px dashed var(--text-muted);
            font-size: 13px;
            color: var(--text-muted);
            transition: all var(--transition-speed-normal) ease;
        }

        .avatar-uploader:hover .avatar-frame {
            border-color: var(--wa-teal-primary);
            color: var(--wa-teal-primary);
            background: rgba(0, 168, 132, 0.05);
        }

        .avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .wa-input {
            width: 100%;
            padding: 14px 20px;
            background: var(--input-field-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
        }

        .wa-input:focus {
            border-color: var(--wa-teal-primary);
        }

        .wa-btn {
            width: 100%;
            padding: 14px 24px;
            background: var(--wa-teal-primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition-speed-fast) ease;
        }

        .wa-btn:hover { background: var(--wa-teal-hover); }

        .mojang-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--wa-dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: var(--layer-loading);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .mojang-overlay.active { opacity: 1; pointer-events: auto; }
        
        .engine-track {
            width: 300px; height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px; margin-top: 30px;
            overflow: hidden;
        }
        .engine-progress {
            width: 0%; height: 100%;
            background: var(--wa-teal-primary);
            transition: width 0.1s linear;
        }

        #whatsapp-frame {
            display: none;
            width: 100vw;
            height: 100vh;
            background-color: var(--wa-dark-bg);
            position: absolute;
            top: 0; left: 0;
            z-index: var(--layer-ground);
        }

        #whatsapp-frame.loaded { display: flex; }

        .sidebar-panel {
            width: 400px;
            min-width: 340px;
            background: var(--wa-dark-bg);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 10px 16px;
            background: var(--wa-panel-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        .sidebar-header .user-identity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--avatar-fallback-bg);
        }

        .nav-actions {
            display: flex;
            gap: 10px;
            color: var(--text-muted);
        }

        .icon-btn {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-speed-fast) ease;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
        }

        .sidebar-tabs {
            display: flex;
            background: var(--wa-dark-bg);
            border-bottom: 1px solid var(--border-subtle);
        }
        .tab-node {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
            transition: all var(--transition-speed-fast) ease;
        }
        .tab-node.active {
            color: var(--wa-teal-primary);
            border-bottom-color: var(--wa-teal-primary);
        }

        .panel-bucket {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow-y: auto;
        }
        .panel-bucket.active { display: flex; }

        .search-container {
            padding: 8px 14px;
            background: var(--wa-dark-bg);
            border-bottom: 1px solid var(--border-subtle);
        }
        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--wa-panel-bg);
            border-radius: 8px;
            padding: 0 12px;
            height: 36px;
        }
        .search-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            margin-left: 10px;
        }

        .friend-group-title {
            padding: 14px 16px 6px;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--wa-teal-primary);
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .chat-list-row {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--border-subtle);
            transition: background var(--transition-speed-fast) ease;
            position: relative;
        }
        .chat-list-row:hover { background: var(--wa-panel-bg); }
        .chat-list-row.active { background: var(--input-field-bg); }

        .avatar-wrapper {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }
        .avatar-wrapper .node-pic {
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
            background: var(--input-field-bg);
        }
        .presence-dot {
            position: absolute;
            bottom: 2px; right: 2px;
            width: 11px; height: 11px;
            border-radius: 50%;
            border: 2px solid var(--wa-dark-bg);
            background: var(--text-muted);
        }
        .presence-dot.online { background: var(--success-green); }

        .row-meta { flex: 1; min-width: 0; }
        .row-header-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .row-name { font-weight: 500; font-size: 15px; color: var(--text-main); }
        .row-time { font-size: 12px; color: var(--text-muted); }
        
        .row-body-line { display: flex; justify-content: space-between; align-items: center; }
        .row-preview { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        
        .badge-counter {
            background: var(--wa-teal-primary);
            color: #111b21;
            font-size: 11px; font-weight: 700;
            padding: 2px 6px; border-radius: 10px;
            min-width: 18px; text-align: center;
        }

        .action-tray { display: flex; gap: 6px; }
        .sm-action-btn {
            padding: 4px 8px; font-size: 12px; font-weight: 600;
            border: none; border-radius: 4px; cursor: pointer;
            background: var(--wa-panel-bg); color: var(--text-main);
        }
        .sm-action-btn.accept { background: var(--wa-teal-primary); color: #fff; }

        .workspace-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--wa-chat-bg);
position: relative;
height: 100%;
}
.splash-panel {
position: absolute;
top: 0; left: 0; width: 100%; height: 100%;
background: var(--wa-dark-bg);
z-index: 5;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
padding: 40px;
}
.splash-art {
width: 200px; height: 200px;
color: var(--text-muted); opacity: 0.15;
margin-bottom: 24px;
}
.splash-title { font-size: 28px; font-weight: 300; margin-bottom: 10px; color: var(--text-main); }
.splash-desc { font-size: 14px; color: var(--text-muted); max-width: 450px; line-height: 1.6; }
.workspace-header {
padding: 10px 16px;
background: var(--wa-panel-bg);
display: flex;
align-items: center;
justify-content: space-between;
height: 60px;
z-index: var(--layer-dock);
border-bottom: 1px solid rgba(0,0,0,0.1);
}
.active-user-meta { display: flex; align-items: center; gap: 12px; }
.active-user-meta img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.active-status-lbl { font-size: 12px; color: var(--text-muted); }
.thread-scroll-view {
flex: 1;
overflow-y: auto;
padding: 20px 30px;
display: flex;
flex-direction: column;
gap: 8px;
background-color: var(--wa-chat-bg);
position: relative;
}
.wa-bubble {
max-width: 60%;
padding: 8px 12px;
border-radius: 8px;
line-height: 1.4;
font-size: 14.5px;
display: flex;
flex-direction: column;
position: relative;
box-shadow: 0 1px 1px rgba(0,0,0,0.15);
word-wrap: break-word;
animation: bubblePop var(--transition-speed-fast) ease-out forwards;
}
@keyframes bubblePop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.wa-bubble.sent {
background: var(--wa-bubble-out);
color: var(--wa-bubble-out-text);
align-self: flex-end;
border-top-right-radius: 0;
}
.wa-bubble.received {
background: var(--wa-bubble-in);
color: var(--wa-bubble-in-text);
align-self: flex-start;
border-top-left-radius: 0;
}
.bubble-author { font-size: 12px; font-weight: 700; color: var(--wa-teal-primary); margin-bottom: 4px; }
.bubble-footer {
display: flex; align-items: center; justify-content: flex-end;
gap: 4px; font-size: 11px; color: var(--text-muted);
margin-top: 4px; align-self: flex-end;
}
.tick-vector { color: #53bdeb; margin-left: 2px; width: 15px; height: 15px; }
.wa-bubble img { max-width: 100%; border-radius: 6px; margin: 4px 0; display: block; }
.wa-bubble audio { margin-top: 4px; width: 240px; }
.input-dock-bar {
padding: 10px 16px;
background: var(--wa-panel-bg);
display: flex;
align-items: center;
gap: 12px;
min-height: 60px;
position: relative;
z-index: var(--layer-dock);
}
.input-dock-bar input[type="text"] {
flex: 1;
background: var(--input-field-bg);
border: none;
padding: 12px 18px;
border-radius: 8px;
color: #ffffff;
font-size: 15px;
outline: none;
}
.popover-menu-frame {
display: none;
position: absolute;
bottom: 68px; left: 16px;
background: var(--wa-panel-bg);
border: 1px solid var(--border-subtle);
border-radius: 12px;
padding: 12px; width: 340px;
box-shadow: var(--box-shadow-heavy);
z-index: var(--layer-popover);
}
.popover-menu-frame.active { display: block; }
.menu-grid-layout { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 240px; overflow-y: auto; }
.grid-asset-node {
font-size: 24px; text-align: center; cursor: pointer; padding: 8px; border-radius: 8px;
transition: background var(--transition-speed-fast) ease;
}
.grid-asset-node:hover { background: var(--input-field-bg); }
.grid-asset-node img { width: 100%; height: auto; border-radius: 4px; }
.audio-tracker-dock {
display: none;
flex: 1;
align-items: center;
background: var(--input-field-bg);
padding: 0 16px;
border-radius: 8px;
gap: 12px; height: 42px;
}
.recording-timer { font-size: 13px; color: var(--danger-red); font-weight: 700; font-family: monospace; }
.visualizer-canvas { flex: 1; height: 26px; }
#wa-call-overlay {
display: none;
position: absolute;
top: 0; left: 0; width: 100%; height: 100%;
background: #0f171c; z-index: var(--layer-overlay);
flex-direction: column; align-items: center; justify-content: center;
}
.call-avatar { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--wa-teal-primary); overflow: hidden; margin-bottom: 20px; }
.call-avatar img { width: 100%; height: 100%; object-fit: cover; }
.call-name { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
.call-status { font-size: 14px; color: var(--text-muted); margin-bottom: 40px; }
.call-controls { display: flex; gap: 30px; }
.call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; }
.call-btn.hangup { background: var(--danger-red); }
.call-btn.answer { background: var(--wa-teal-primary); }
.theme-selector-panel {
padding: 10px 14px;
background: var(--wa-panel-bg);
border-bottom: 1px solid var(--border-subtle);
}
.theme-select-input {
width: 100%; padding: 8px; background: var(--wa-dark-bg);
color: var(--text-main); border: 1px solid var(--border-subtle); border-radius: 6px; outline: none;
}    <!-- Cinematic System Sync Buffer Screen Overlay -->
    <div class="mojang-overlay" id="loadingStage">
        <h3 style="font-weight: 400; letter-spacing: 1px;">Synchronizing Peripheral Sync Matrix Layer...</h3>
        <div class="engine-track"><div class="engine-progress" id="loadingEngineBar"></div></div>
    </div>
    <!-- Main Application Core Application Frame Mounting Canvas -->
    <div id="whatsapp-frame">
        
        <!-- Left Side System Navigation Controller Sidebar Panel -->
        <div class="sidebar-panel">
            <div class="sidebar-header">
                
                    <img id="my-profile-display-node" src="data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='40' height='40'%3E%3Crect width='40' height='40' fill='%232a3942'/%3E%3C/svg%3E" alt="Avatar">
                    <span id="my-profile-name-node" style="font-weight:600; font-size:14px;">User Terminal</span>
                </div>
                <div class="nav-actions">
                    <button class="icon-btn" onclick="openChannelCreationPrompt()" title="Create Session Channel"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
                    <button class="icon-btn" onclick="purgeHardwareSessionData()" title="Purge System Cache Data Engine"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M19 8l-1.41-1.41L12 12.17 6.41 6.59 5 8l7 7 7-7z"/></svg></button>
                </div>
            </div>

            <!-- Dynamic Workspace Layout Configuration Interface Picker Menu -->
            <div class="theme-selector-panel">
                <select class="theme-select-input" id="theme-selector-node" onchange="changeSystemUIVariant(this.value)">
                    <option value="theme-classic">🟢 Context Skin: Classic Teal WhatsApp</option>
                    <option value="theme-midnight">🔵 Context Skin: Dark Midnight Deep Ocean</option>
                    <option value="theme-ruby">🔴 Context Skin: Crimson Ruby Accent Matrix</option>
                    <option value="theme-cyberpunk">🟪 Context Skin: High-Fidelity Cyberpunk Neon</option>
                    <option value="theme-monochrome">⚪ Context Skin: Industrial Slate Monochrome</option>
                    <option value="theme-matrix">📟 Context Skin: Digital Matrix Console Buffer</option>
                </select>
            </div>

            <!-- Operational Workspace Navigation Category Index Matrix tabs -->

            const outputFrame = document.getElementById('discovery-results-injection');

            discoveryRosterIndex.forEach((profile) => {

            const targetProfile = discoveryRosterIndex.find(p => p.username === targetUsername);

            pendingFriendRequests.splice(index, 1);
            commitMemoryBuffersToStorage();
