<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Form Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111b21;
            color: #e9edef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #202c33;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 350px;
        }
        h2 {
            margin-bottom: 20px;
            color: #00a884;
            text-align: center;
        }
        input[type="email"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #2a3942;
            background-color: #2a3942;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00a884;
            color: #111b21;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #008769;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Email Test Form</h2>
        
        <!-- Replace YOUR_EMAIL@EXAMPLE.COM with your actual email address -->
        <form action="https://formsubmit.co" method="POST">
            
            <label for="email">Your Email Address:</label>
            <input type="email" name="email" id="email" placeholder="name@example.com" required>
            
            <label for="message">Test Message:</label>
            <textarea name="message" id="message" rows="4" placeholder="Type your test message here..." required></textarea>
            
            <!-- Optional configuration fields to customize behavior -->
            <input type="hidden" name="_subject" value="New Test Submission from HTML Page!">
            <input type="hidden" name="_captcha" value="false">

            <button type="submit">Send Test Email</button>
        </form>
    </div>

</body>
</html>
