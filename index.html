<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat Messenger Client - Stable Edition</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    
    <script src="https://google.com" async defer></script>

    <style>
        :root {
            /* Premium Glassmorphic Obsidian-Cyan Design Tokens */
            --bg-dark: #07090e;
            --bg-dark-gradient: linear-gradient(135deg, #07090e 0%, #0a1118 100%);
            --bg-panel: rgba(10, 20, 30, 0.65);
            --bg-sidebar: rgba(6, 10, 15, 0.85);
            --primary-accent: #00ffff;
            --primary-hover: #00cccc;
            --primary-glow: rgba(0, 255, 255, 0.4);
            --text-main: #f2f3f5;
            --text-muted: #8a9aa8;
            --danger-red: #ff3344;
            --danger-hover: #cc2233;
            --success-green: #00ff66;
            --border-subtle: rgba(0, 255, 255, 0.15);
            --border-active: rgba(0, 255, 255, 0.6);
            --input-bg: rgba(5, 10, 15, 0.8);
            --gold-accent: #f5a623;
            --pink-neon: #ff007f;
            
            /* UI Sizing Anchors */
            --nav-rail-width: 75px;
            --sidebar-width: 280px;
            
            /* Enhanced Animation Metrics */
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --neon-glow-shadow: 0 0 15px rgba(0, 255, 255, 0.35);
        }

        /* Global Structural Overrides & Reset Rules */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html, button, input, textarea, select {
            cursor: default;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            background-image: var(--bg-dark-gradient);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Scannable Scrollbar Elements */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.15);
            border-radius: 10px;
            transition: var(--transition-smooth);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-accent);
            box-shadow: var(--neon-glow-shadow);
        }

        .text-truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hardware-accelerated {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        /* Cinematic Loading Portal Splash Overlay Styles */
        #splash-loading-portal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #04060a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: opacity, transform;
        }

        #splash-loading-portal.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .splash-logo-container {
            width: 90px;
            height: 90px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .splash-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: pulseLogo 2s ease-in-out infinite;
        }

        .splash-headline {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 12px;
            text-align: center;
            text-shadow: 0 0 16px rgba(0, 255, 255, 0.4);
            text-transform: uppercase;
        }

        .splash-user-subtitle {
            font-size: 14px;
            color: var(--primary-accent);
            font-weight: 600;
            margin-bottom: 35px;
            min-height: 24px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
        }

        .progress-track-wrapper {
            width: 320px;
            height: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.1);
            position: relative;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-hover), var(--primary-accent));
            box-shadow: 0 0 16px var(--primary-accent);
            transition: width 0.15s linear;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.2)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 24px var(--primary-accent)); }
        }

        /* Master Application Layout Window Frame */
        #app-frame {
            display: flex;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            background: var(--bg-dark-gradient);
            will-change: opacity, transform;
        }

        #app-frame.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Secure Login Gate Overlay Context Matrix */
        #secure-login-gate-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(145deg, #040814 0%, #0d1326 100%);
            z-index: 8000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s ease;
            will-change: opacity, transform;
        }

        #secure-login-gate-overlay.hidden {
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
        }

        .login-card-glassmorphic-wrapper {
            width: 460px;
            max-width: 100%;
            background: rgba(15, 25, 45, 0.45);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .login-card-header {
            text-align: center;
        }

        .login-brand-logo-node {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .login-title-h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 6px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .login-subtitle-p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .oauth-providers-button-stack {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .oauth-provider-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer !important;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-smooth);
        }

        .oauth-provider-btn:hover {
            background: rgba(0, 255, 255, 0.05);
            border-color: var(--primary-accent);
            box-shadow: 0 0 10px var(--primary-glow);
            color: #ffffff;
        }

        .google-identity-injection-node {
            display: flex;
            justify-content: center;
            margin: 6px 0;
            min-height: 44px;
        }

        .login-divider-row {
            display: flex;
            align-items: center;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .login-divider-row::before, .login-divider-row::after {
            content: '';
            flex: 1;
border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.login-divider-row:not(:empty)::before { margin-right: 14px; }
.login-divider-row:not(:empty)::after { margin-left: 14px; }
.registration-input-group-form {
display: flex;
flex-direction: column;
gap: 16px;
}
.form-label-node {
font-size: 11px;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 1px;
color: var(--text-muted);
margin-bottom: 8px;
display: block;
}
.form-text-input-field {
width: 100%;
background: var(--input-bg);
border: 1px solid var(--border-subtle);
padding: 12px 14px;
border-radius: 6px;
color: #ffffff;
font-size: 14px;
outline: none;
transition: var(--transition-smooth);
}
.form-text-input-field:focus {
border-color: var(--primary-accent);
box-shadow: 0 0 12px var(--primary-glow);
}
.avatar-file-upload-trigger-container {
display: flex;
align-items: center;
gap: 14px;
}
.avatar-upload-preview-frame {
width: 48px;
height: 48px;
border-radius: 50%;
background: rgba(255, 255, 255, 0.02);
border: 1px solid var(--border-subtle);
display: flex;
align-items: center;
justify-content: center;
color: var(--text-muted);
font-size: 14px;
font-weight: 700;
flex-shrink: 0;
overflow: hidden;
box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
}
.avatar-upload-preview-frame img {
width: 100%;
height: 100%;
object-fit: cover;
}
.custom-file-input-facade-btn {
background: rgba(255, 255, 255, 0.03);
border: 1px solid var(--border-subtle);
padding: 10px 16px;
border-radius: 6px;
font-size: 12px;
font-weight: 600;
color: var(--text-main);
cursor: pointer !important;
transition: var(--transition-smooth);
}
.custom-file-input-facade-btn:hover {
border-color: var(--text-muted);
background: rgba(255, 255, 255, 0.08);
}
.submit-portal-access-btn {
width: 100%;
background: transparent;
color: var(--primary-accent);
border: 1px solid var(--primary-accent);
padding: 14px;
border-radius: 6px;
font-size: 14px;
font-weight: 700;
cursor: pointer !important;
transition: var(--transition-smooth);
box-shadow: 0 0 8px var(--primary-glow);
margin-top: 8px;
text-transform: uppercase;
letter-spacing: 1px;
}
.submit-portal-access-btn:hover {
background: var(--primary-hover);
color: #000000;
box-shadow: 0 0 16px var(--primary-accent);
}
.global-nav-rail {
width: var(--nav-rail-width);
height: 100%;
background: rgba(3, 6, 10, 0.95);
border-right: 1px solid var(--border-subtle);
display: flex;
flex-direction: column;
align-items: center;
padding: 20px 0;
gap: 20px;
z-index: 10;
flex-shrink: 0;
}
.rail-tab-item {
width: 48px;
height: 48px;
border-radius: 14px;
background: rgba(255, 255, 255, 0.02);
border: 1px solid var(--border-subtle);
display: flex;
align-items: center;
justify-content: center;
cursor: pointer !important;
color: var(--text-muted);
font-size: 22px;
position: relative;
transition: var(--transition-bounce);
}
.rail-tab-item:hover {
color: var(--primary-accent);
background: rgba(0, 255, 255, 0.05);
border-color: var(--primary-accent);
transform: scale(1.12) translateY(-2px);
box-shadow: 0 0 16px var(--primary-glow);
}
.rail-tab-item.active {
color: #ffffff;
background: var(--primary-hover);
border-color: var(--primary-accent);
box-shadow: 0 0 14px rgba(0, 255, 255, 0.45);
}
.sidebar-panel {
width: var(--sidebar-width);
min-width: var(--sidebar-width);
background: var(--bg-sidebar);
border-right: 1px solid var(--border-subtle);
display: flex;
flex-direction: column;
height: 100%;
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
flex-shrink: 0;
}
.sidebar-header {
padding: 16px;
background: rgba(15, 25, 35, 0.45);
display: flex;
align-items: center;
justify-content: space-between;
border-bottom: 1px solid var(--border-subtle);
height: 70px;
box-sizing: border-box;
}
.profile-node-area {
display: flex;
align-items: center;
gap: 12px;
min-width: 0;
width: 100%;
}
.user-tag-avatar {
width: 38px;
height: 38px;
background: rgba(0, 255, 255, 0.08);
border: 1px solid var(--primary-accent);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 14px;
font-weight: 700;
color: var(--primary-accent);
box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
flex-shrink: 0;
overflow: hidden;
}
.user-tag-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
}
.sidebar-title {
font-weight: 700;
font-size: 14px;
color: var(--text-main);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
flex: 1;
}
.sidebar-tools {
padding: 14px 12px;
display: flex;
flex-direction: column;
gap: 10px;
background: rgba(5, 10, 15, 0.35);
border-bottom: 1px solid var(--border-subtle);
}
.sm-btn {
width: 100%;
padding: 10px 14px;
font-size: 13px;
font-weight: 600;
background: rgba(255, 255, 255, 0.02);
color: var(--text-main);
border: 1px solid var(--border-subtle);
border-radius: 6px;
cursor: pointer !important;
transition: var(--transition-smooth);
text-align: left;
}
.sm-btn:hover {
background: rgba(0, 255, 255, 0.08);
border-color: var(--primary-accent);
color: #ffffff;
box-shadow: 0 0 10px rgba(0, 255, 255, 0.15);
}
.sm-btn.danger {
background: rgba(255, 51, 68, 0.05);
color: var(--danger-red);
border-color: rgba(255, 51, 68, 0.25);
}
.sm-btn.danger:hover {
background: var(--danger-red);
border-color: var(--danger-red);
color: white;
box-shadow: 0 0 12px rgba(255, 51, 68, 0.35);
}
.shop-trigger-btn {
width: 100%;
padding: 12px;
font-size: 13px;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 1px;
background: transparent;
color: var(--primary-accent);
border: 1px solid var(--primary-accent);
border-radius: 6px;
cursor: pointer !important;
transition: var(--transition-smooth);
text-align: center;
box-shadow: 0 0 8px var(--primary-glow);
}
.shop-trigger-btn:hover {
background: var(--primary-hover);
color: #000000;
box-shadow: 0 0 16px var(--primary-accent);
}
.contacts-vertical-stack {
flex: 1;
overflow-y: auto;
padding: 10px 0;
display: flex;
flex-direction: column;
}
.chat-list-row {
padding: 14px 16px;
cursor: pointer !important;
display: flex;
align-items: center;
gap: 14px;
border-bottom: 1px solid rgba(255, 255, 255, 0.01);
transition: var(--transition-smooth);
border-left: 3px solid transparent;
}
.chat-list-row:hover, .chat-list-row.active {
background: rgba(0, 255, 255, 0.04);
border-left-color: var(--primary-accent);
}
.row-avatar {
font-size: 14px;
font-weight: 700;
width: 34px;
height: 34px;
background: rgba(255, 255, 255, 0.02);
border: 1px solid var(--border-subtle);
display: flex;
align-items: center;
justify-content: center;
border-radius: 50%;
flex-shrink: 0;
color: var(--text-muted);
}
.chat-list-row:hover .row-avatar, .chat-list-row.active .row-avatar {
color: var(--primary-accent);
border-color: var(--primary-accent);
}
.row-meta {
flex: 1;
min-width: 0;
}
.row-name {
font-weight: 600;
font-size: 14px;
margin-bottom: 3px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
color: var(--text-main);
}
.row-preview {
font-size: 11px;
color: var(--text-muted);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.workspace-panel {
flex: 1;
display: flex;
flex-direction: column;
background: var(--bg-dark);
position: relative;
height: 100%;
min-width: 0;
}
.workspace-header {
padding: 14px 24px;
background: var(--bg-panel);
display: flex;
align-items: center;
justify-content: space-between;
border-bottom: 1px solid var(--border-subtle);
height: 70px;
box-sizing: border-box;
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
z-index: 5;
flex-shrink: 0;
}
.header-profile {
display: flex;
align-items: center;
gap: 12px;
min-width: 0;
}
.header-profile .title {
font-weight: 600;
font-size: 16px;
letter-spacing: 0.5px;
color: #ffffff;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.thread-scroll-view {
flex: 1;
overflow-y: auto;
padding: 24px;
display: flex;
flex-direction: column;
gap: 16px;
box-sizing: border-box;
background: rgba(4, 6, 10, 0.2);
}
.msg-bubble {
max-width: 65%;
padding: 12px 18px;
border-radius: 14px;
line-height: 1.5;
font-size: 14px;
display: flex;
flex-direction: column;
word-wrap: break-word;
background: rgba(255, 255, 255, 0.02);
border: 1px solid var(--border-subtle);
box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
transition: var(--transition-smooth);
position: relative;
}
.msg-bubble.sent {
background: rgba(0, 255, 255, 0.05);
border-color: rgba(0, 255, 255, 0.25);
align-self: flex-end;
border-bottom-right-radius: 0;
box-shadow: 0 4px 16px rgba(0, 255, 255, 0.03);
}
.msg-bubble.received {
background: rgba(255, 255, 255, 0.01);
border-color: rgba(255, 255, 255, 0.08);
align-self: flex-start;
border-bottom-left-radius: 0;
}
.msg-author {
font-size: 11px;
font-weight: 700;
color: var(--primary-accent);
margin-bottom: 4px;
letter-spacing: 0.5px;
text-transform: uppercase;
}
.msg-bubble.sent .msg-author {
color: #ffffff;
text-shadow: 0 0 8px var(--primary-glow);
}
.msg-footer {
font-size: 10px;
color: var(--text-muted);
margin-top: 6px;
align-self: flex-end;
font-weight: 500;
}
.input-dock-bar {
padding: 16px 24px;
background: var(--bg-panel);
display: flex;
align-items: center;
gap: 12px;
border-top: 1px solid var(--border-subtle);
height: 75px;
box-sizing: border-box;
position: relative;
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
z-index: 5;
flex-shrink: 0;
}
.input-dock-bar input[type="text"] {
flex: 1;
background: var(--input-bg);
border: 1px solid var(--border-subtle);
padding: 12px 16px;
border-radius: 6px;
color: #ffffff;
font-size: 14px;
outline: none;
transition: var(--transition-smooth);
}
.input-dock-bar input[type="text"]:focus {
border-color: var(--primary-accent);
box-shadow: 0 0 10px var(--primary-glow);
}
.input-dock-bar input[type="text"]:disabled {
background: rgba(10, 15, 20, 0.9);
color: var(--text-muted);
cursor: not-allowed !important;
}
.cooldown-progress-track {
position: absolute;
bottom: 0;
left: 0;
height: 3px;
width: 100%;
background: rgba(255, 255, 255, 0.01);
pointer-events: none;
}
.cooldown-progress-fill {
height: 100%;
width: 0%;
background: var(--primary-accent);
box-shadow: 0 0 10px var(--primary-accent);
}
.emoji-trigger-node-btn {
background: transparent;
border: 1px solid var(--border-subtle);
color: var(--text-muted);
font-size: 18px;
padding: 8px;
border-radius: 6px;
cursor: pointer !important;
transition: var(--transition-smooth);
display: flex;
align-items: center;
justify-content: center;
width: 38px;
height: 38px;
}
.emoji-trigger-node-btn:hover {
color: var(--primary-accent);
border-color: var(--primary-accent);
background: rgba(0, 255, 255, 0.05);
box-shadow: 0 0 8px var(--primary-glow);
}
.emoji-picker-matrix-overlay {
position: absolute;
bottom: 85px;
right: 24px;
width: 320px;
height: 240px;
background: rgba(10, 16, 26, 0.96);
border: 1px solid var(--border-active);
border-radius: 10px;
box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
display: none;
flex-direction: column;
z-index: 1000;
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
}
.emoji-picker-header {
padding: 12px;
font-size: 11px;
font-weight: 700;
letter-spacing: 1px;
color: var(--text-muted);
border-bottom: 1px solid var(--border-subtle);
text-transform: uppercase;
}
.emoji-grid-scroller {
flex: 1;
overflow-y: auto;
padding: 12px;
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 8px;
}
.emoji-grid-item-cell {
display: flex;
align-items: center;
justify-content: center;
font-size: 20px;
padding: 6px;
border-radius: 6px;
cursor: pointer !important;
transition: background 0.15s ease, transform 0.1s ease;
}
.emoji-grid-item-cell:hover {
background: rgba(0, 255, 255, 0.15);
transform: scale(1.15);
}

function initiateMicrophoneAnalysisAudioEngine(streamObject) {
try {
initAudioContext();
if (!audioCtx) return;
localMicrophoneAudioSource = audioCtx.createMediaStreamSource(streamObject);
localAudioAnalyserNode = audioCtx.createAnalyser();
localAudioAnalyserNode.fftSize = 64;
localMicrophoneAudioSource.connect(localAudioAnalyserNode);
executeEqualizerRenderFrameLoop();
} catch (err) {
console.warn("Audio visualizer node assignment error: ", err);
}
}
function executeEqualizerRenderFrameLoop() {
if (!localAudioAnalyserNode) return;
const bufferLen = localAudioAnalyserNode.frequencyBinCount;
const dataArray = new Uint8Array(bufferLen);
localAudioAnalyserNode.getByteFrequencyData(dataArray);
let frequencySum = 0;
for (let i = 0; i < bufferLen; i++) {
frequencySum += dataArray[i];
}
const averageVolume = frequencySum / bufferLen;
const targetContainer = document.getElementById('webcam-hardware-window-node');
if (targetContainer) {
if (averageVolume > 25) {
targetContainer.classList.add('speaking-active');
let dynamicGlowRadius = Math.min(30, Math.floor(averageVolume / 3));
targetContainer.style.boxShadow = "0 0 " + dynamicGlowRadius + "px var(--primary-glow), inset 0 0 20px rgba(0, 255, 255, 0.15)";
} else {
targetContainer.classList.remove('speaking-active');
targetContainer.style.boxShadow = 'none';
}
}
micAnimationRequestId = requestAnimationFrame(executeEqualizerRenderFrameLoop);
}
function haltMicrophoneAnalysisAudioEngine() {
if (micAnimationRequestId) cancelAnimationFrame(micAnimationRequestId);
const targetContainer = document.getElementById('webcam-hardware-window-node');
if (targetContainer) {
targetContainer.classList.remove('speaking-active');
targetContainer.style.boxShadow = 'none';
}
if (localMicrophoneAudioSource) localMicrophoneAudioSource.disconnect();
localAudioAnalyserNode = null;
localMicrophoneAudioSource = null;
}

function initiateChronometerClock() {

const durationClock = document.getElementById('call-duration-clock');

elapsedCallSeconds++;
let displayMinutes = String(Math.floor(elapsedCallSeconds / 60)).padStart(2, '0');
let displaySeconds = String(elapsedCallSeconds % 60).padStart(2, '0');
if (durationClock) {
durationClock.innerText = displayMinutes + ":" + displaySeconds;
}
}, 1000);
}
function terminateChronometerClock() {
clearInterval(callTimerInterval);
document.getElementById('call-duration-clock').innerText = "00:00";
}
