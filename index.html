<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat Messenger Client</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-panel: #181b22;
            --bg-sidebar: #12141a;
            --primary-accent: #5865F2; 
            --primary-hover: #4752C4;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --danger-red: #da373c;
            --danger-hover: #a92b2f;
            --success-green: #23a55a;
            --border-subtle: #202225;
            --input-bg: #1e1f22;
        }

        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            user-select: none;
        }

        /* Cinematic Loading Portal Splash Overlay */
        #splash-loading-portal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0c10;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s ease;
        }

        #splash-loading-portal.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .splash-logo {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulseLogo 2s ease-in-out infinite;
        }

        .splash-headline {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
        }

        .splash-user-subtitle {
            font-size: 18px;
            color: var(--primary-accent);
            font-weight: 500;
            margin-bottom: 30px;
            min-height: 24px;
        }

        .progress-track-wrapper {
            width: 280px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--primary-accent);
            box-shadow: 0 0 16px var(--primary-accent);
            transition: width 0.1s linear;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(88,101,242,0.2)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(88,101,242,0.6)); }
        }

        /* Master Application View Grid Frame mount */
        #app-frame {
            display: flex;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #app-frame.visible {
            opacity: 1;
        }

        /* Sidebar Navigation Grid */
        .sidebar-panel {
            width: 320px;
            min-width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 16px;
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            height: 70px;
            box-sizing: border-box;
        }

        .profile-node-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-tag-avatar {
            width: 36px;
            height: 36px;
            background: var(--primary-accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .sidebar-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .sidebar-tools {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-subtle);
        }

        .sm-btn {
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            background: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .sm-btn:hover {
            background: var(--primary-accent);
            border-color: var(--primary-accent);
        }

        .sm-btn.danger {
            background: rgba(218, 55, 60, 0.1);
            color: var(--danger-red);
            border: 1px solid rgba(218, 55, 60, 0.2);
        }

        .sm-btn.danger:hover {
            background: var(--danger-red);
            color: white;
        }

        .chat-scroll-stack {
            flex: 1;
            overflow-y: auto;
        }

        .chat-list-row {
            padding: 14px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-subtle);
            transition: background 0.2s ease;
        }

        .chat-list-row:hover, .chat-list-row.active {
            background: var(--bg-panel);
        }

        .row-avatar {
            font-size: 18px;
            width: 38px;
            height: 38px;
            background: #2e3035;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .row-meta {
            flex: 1;
            min-width: 0;
        }

        .row-name {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-preview {
            font-size: 11.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Central Workspace Panel */
        .workspace-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            position: relative;
            height: 100%;
        }

        .workspace-header {
            padding: 14px 24px;
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            height: 70px;
            box-sizing: border-box;
        }

        .header-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-profile .title {
            font-weight: 600;
            font-size: 16px;
        }

        .call-action-btn {
            background: var(--primary-accent);
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .call-action-btn:hover {
            background: var(--primary-hover);
        }

        /* Call Module Overlay Workspace Grid (Replaces previous static placeholders completely) */
        #call-interface-layer {
            display: none;
            flex-direction: column;
            background: #111214;
            padding: 16px;
            border-bottom: 1px solid var(--border-subtle);
            box-sizing: border-box;
        }

        .media-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            min-height: 240px;
        }

        @media (max-width: 768px) {
            .media-grid { grid-template-columns: 1fr; }
        }

        .media-window {
            background: #1e1f22;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #2b2d31;
            overflow: hidden;
        }

        .stream-canvas-mock {
            width: 100%;
            height: 100%;
            position: absolute;
            background: linear-gradient(45deg, #111214, #2b2d31);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .stream-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
            z-index: 2;
            font-weight: 500;
        }

        .avatar-placeholder-call {
            width: 68px;
            height: 68px;
            border-radius: 50%;
background: var(--primary-accent);
display: flex;
align-items: center;
justify-content: center;
font-size: 28px;
z-index: 1;
transition: all 0.3s ease;
}
/* Controls Block */
.call-controls-bar {
display: flex;
justify-content: center;
align-items: center;
gap: 12px;
margin-top: 14px;
background: #181b22;
padding: 10px 16px;
border-radius: 8px;
flex-wrap: wrap;
}
.control-btn {
background: #2b2d31;
border: none;
color: white;
padding: 10px 16px;
border-radius: 6px;
cursor: pointer;
font-weight: 600;
font-size: 13px;
display: flex;
align-items: center;
gap: 6px;
transition: background 0.2s;
}
.control-btn:hover { background: #35373c; }
.control-btn.active-state { background: var(--danger-red); }
.control-btn.active-state:hover { background: var(--danger-hover); }
.call-timer-node {
color: var(--text-main);
font-family: monospace;
font-size: 14px;
background: #111214;
padding: 6px 12px;
border-radius: 4px;
font-weight: 700;
}
/* Thread History Messaging Viewport Window */
.thread-scroll-view {
flex: 1;
overflow-y: auto;
padding: 24px;
display: flex;
flex-direction: column;
gap: 14px;
box-sizing: border-box;
}
.msg-bubble {
max-width: 65%;
padding: 12px 16px;
border-radius: 8px;
line-height: 1.45;
font-size: 14.5px;
display: flex;
flex-direction: column;
word-wrap: break-word;
box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}
.msg-bubble.sent {
background: var(--primary-accent);
align-self: flex-end;
border-bottom-right-radius: 0;
}
.msg-bubble.received {
background: #2b2d31;
align-self: flex-start;
border-bottom-left-radius: 0;
}
.msg-author {
font-size: 12px;
font-weight: 700;
color: #ffffff;
margin-bottom: 4px;
}
.msg-footer {
font-size: 10.5px;
color: rgba(255, 255, 255, 0.6);
margin-top: 6px;
align-self: flex-end;
}
.msg-bubble.received .msg-footer {
color: var(--text-muted);
}
/* Input Component Dock Bar */
.input-dock-bar {
padding: 16px 24px;
background: var(--bg-panel);
display: flex;
align-items: center;
gap: 12px;
border-top: 1px solid var(--border-subtle);
height: 75px;
box-sizing: border-box;
}
.input-dock-bar input[type="text"] {
flex: 1;
background: var(--input-bg);
border: 1px solid var(--border-subtle);
padding: 14px 18px;
border-radius: 6px;
color: #ffffff;
font-size: 14.5px;
outline: none;
transition: border-color 0.2s;
}
.input-dock-bar input[type="text"]:focus {
border-color: var(--primary-accent);
}
.send-btn {
background: var(--primary-accent);
color: white;
border: none;
padding: 12px 24px;
border-radius: 6px;
font-weight: 600;
cursor: pointer;
transition: background 0.2s;
}
.send-btn:hover { background: var(--primary-hover); }

// High Fidelity Audio Engine Web API Hardware Synthesis Configuration
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSynthFrequency(frequency, type, duration, volume = 0.12) {
try {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type;
osc.frequency.value = frequency;
gain.gain.setValueAtTime(volume, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + duration);
} catch (e) { console.log("Audio infrastructure interaction wait tracer query."); }
}
// Custom Acoustic Tonal Feedback Arrays matching precise messenger specifications
function triggerMsgAlertTone() {
// Precise dual tone sequence mirroring high-end instant messenger applications
playSynthFrequency(660, 'sine', 0.10, 0.15);
setTimeout(() => playSynthFrequency(880, 'sine', 0.12, 0.15), 65);
}
function triggerToggleMuteTone(isMuted) {
if (isMuted) {
playSynthFrequency(420, 'triangle', 0.12, 0.2);
setTimeout(() => playSynthFrequency(310, 'triangle', 0.15, 0.2), 60);
} else {
playSynthFrequency(310, 'triangle', 0.12, 0.2);
setTimeout(() => playSynthFrequency(420, 'triangle', 0.15, 0.2), 60);
}
}
// Runtime State Memory Repositories
let currentProfileSessionName = "";
let activeChannelId = 'global-lobby';
let channelDatabase = {
'global-lobby': { name: "Global Public Lobby", history: [] },
'crew-vc': { name: "Crew Voice Lounge", history: [] }
};
let isCallActive = false;
let isAudioMuted = false;
let isCameraActive = false;
let isScreenSharing = false;
let callTimerInterval = null;
let elapsedCallSeconds = 0;
// Session Account Initialization Validation Loop
window.addEventListener('DOMContentLoaded', () => {
evaluateUserIdentityState();
});
function evaluateUserIdentityState() {
const cachedName = localStorage.getItem('nexuschat_user_v4');
const targetSubtitleNode = document.getElementById('splash-user-target');
if (cachedName && cachedName.trim() !== "") {
currentProfileSessionName = cachedName;
targetSubtitleNode.innerText = ${currentProfileSessionName};
// Set sidebar values
document.getElementById('my-username-node').innerText = currentProfileSessionName;
document.getElementById('my-avatar-node').innerText = currentProfileSessionName.charAt(0).toUpperCase();
} else {
currentProfileSessionName = "";
targetSubtitleNode.innerText = ""; // Empty string for anonymous/unlogged state
// Prompt setup loop immediately before loader progress begins to acquire name values cleanly
const promptedName = prompt("Welcome to NexusChat! Please input your profile display name nickname below to log in (Leave blank for guest):");
if (promptedName && promptedName.trim() !== "") {
currentProfileSessionName = promptedName.trim();
localStorage.setItem('nexuschat_user_v4', currentProfileSessionName);
targetSubtitleNode.innerText = ${currentProfileSessionName};
document.getElementById('my-username-node').innerText = currentProfileSessionName;
document.getElementById('my-avatar-node').innerText = currentProfileSessionName.charAt(0).toUpperCase();
} else {
document.getElementById('my-username-node').innerText = "Guest User";
document.getElementById('my-avatar-node').innerText = "G";
}
}
runCinematicProgressBar();
}
function runCinematicProgressBar() {
let progress = 0;
const fillBar = document.getElementById('splash-bar-fill');
const loaderInterval = setInterval(() => {
if (progress >= 100) {
clearInterval(loaderInterval);
terminateLoadingSplashSequence();
} else {
progress += Math.floor(Math.random() * 15) + 5;
if (progress > 100) progress = 100;
fillBar.style.width = progress + '%';
}
}, 80);
}
function terminateLoadingSplashSequence() {
setTimeout(() => {
document.getElementById('splash-loading-portal').classList.add('hidden');
document.getElementById('app-frame').classList.add('visible');
renderSidebarChannels();
loadTargetChannel(activeChannelId);
// Dispatches dynamic setup welcome text bubble logs matching identity states
setTimeout(() => {
const welcomeUserText = currentProfileSessionName ? currentProfileSessionName : "Guest";
appendBubbleElement("Nexus Bot", Hello ${welcomeUserText}! Connection to messaging sync nodes established successfully. Client ready., "received");
}, 500);
}, 400);
}
// Interface Channel Tree Redraw loops
function renderSidebarChannels() {
const container = document.getElementById('contacts-vertical-stack');
if(!container) return;
container.innerHTML = '';
for (let id in channelDatabase) {
const isActive = (id === activeChannelId) ? 'active' : '';
container.innerHTML += <div class="chat-list-row ${isActive}" onclick="loadTargetChannel('${id}')"> <div class="row-avatar">#</div> <div class="row-meta"> <div class="row-name">${channelDatabase[id].name}</div> <div class="row-preview">Open communication logs...</div> </div> </div>;
}
}
function loadTargetChannel(id) {
if (!channelDatabase[id]) return;
activeChannelId = id;
document.getElementById('active-chat-headline-node').innerText = channelDatabase[id].name;
const entries = document.querySelectorAll('.chat-list-row');
entries.forEach(row => row.classList.remove('active'));
repaintMessageLogs();
renderSidebarChannels();
}
function executeTextDispatch() {
const inputField = document.getElementById('text-message-input-node');
const dataString = inputField.value.trim();
if (!dataString) return;
const dispatchAuthor = currentProfileSessionName ? currentProfileSessionName : "You (Guest)";
appendBubbleElement(dispatchAuthor, dataString, "sent");
inputField.value = '';
// Simulated real-time interaction loops answering inputs organically
setTimeout(() => {
const automatedPool = [
"Telemetry data confirmed across centralized GitHub hosting node paths.",
"Message trace synchronized with local web client memory matrices perfectly.",
"Active terminal channel thread logging online updates.",
"Understood. Everything is responding instantly without unhandled exceptions!"
];
const selectedText = automatedPool[Math.floor(Math.random() * automatedPool.length)];
appendBubbleElement("Crew Member", selectedText, "received");
}, 1200);
}
function appendBubbleElement(author, content, variant) {
const timeCode = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
if (!channelDatabase[activeChannelId].history) {
channelDatabase[activeChannelId].history = [];
}
channelDatabase[activeChannelId].history.push({ author, content, variant, timeCode });
if (variant === 'received') {
triggerMsgAlertTone();
}
repaintMessageLogs();
}
function repaintMessageLogs() {
const viewTarget = document.getElementById('chat-thread-viewport');
if(!viewTarget) return;
viewTarget.innerHTML = '';
const logs = channelDatabase[activeChannelId].history || [];
logs.forEach(msg => {
viewTarget.innerHTML += <div class="msg-bubble ${msg.variant}"> <span class="msg-author">${msg.author}</span> <div>${msg.content}</div> <div class="msg-footer">${msg.timeCode}</div> </div>;
});
viewTarget.scrollTop = viewTarget.scrollHeight;
}
function trapInputKeypress(e) {
if (e.key === 'Enter') executeTextDispatch();
}
function triggerChannelCreation() {
const titleInput = prompt("Enter character name label for new application conversation channel:");
if (!titleInput || titleInput.trim() === "") return;
const generatedId = 'ch-node-' + Date.now();
channelDatabase[generatedId] = { name: titleInput.trim(), history: [] };
loadTargetChannel(generatedId);
}
function performProfileHardwareReset() {
localStorage.removeItem('nexuschat_user_v4');
window.location.reload();
}
/* Voice Call Component Grid Controller Toggles */
function toggleVoiceVideoCall() {
const layerBlock = document.getElementById('call-interface-layer');
const joinBtn = document.querySelector('.call-action-btn');
isCallActive = !isCallActive;
if (isCallActive) {
layerBlock.style.display = 'flex';
joinBtn.innerText = "❌ Disconnect Call";
joinBtn.style.background = "var(--danger-red)";
initiateChronometerClock();
// Play connection notification tones
playSynthFrequency(440, 'sine', 0.15, 0.12);
setTimeout(() => playSynthFrequency(660, 'sine', 0.20, 0.12), 110);
} else {
layerBlock.style.display = 'none';
joinBtn.innerText = "🔊 Join Voice Channel";
joinBtn.style.background = "var(--primary-accent)";
terminateChronometerClock();
// Clear media states down to default safe un-triggered values cleanly
if(isCameraActive) toggleWebcamState();
if(isScreenSharing) toggleScreenShareState();
if(isAudioMuted) toggleMuteState();
playSynthFrequency(660, 'sine', 0.15, 0.12);
setTimeout(() => playSynthFrequency(380, 'sine', 0.25, 0.12), 110);
}
}
function toggleMuteState() {
isAudioMuted = !isAudioMuted;
const muteBtn = document.getElementById('mute-audio-toggle');
if (isAudioMuted) {
muteBtn.innerText = "🎙️ Audio Muted";
muteBtn.classList.add('active-state');
} else {
muteBtn.innerText = "🔊 Unmuted";
muteBtn.classList.remove('active-state');
}
triggerToggleMuteTone(isAudioMuted);
}
function toggleWebcamState() {
isCameraActive = !isCameraActive;
const camBtn = document.getElementById('webcam-video-toggle');
const webcamBox = document.getElementById('webcam-canvas');
const titleLabel = document.getElementById('webcam-label');
const centerIcon = document.getElementById('webcam-avatar');
if (isCameraActive) {
camBtn.innerText = "📹 Disable Camera";
camBtn.classList.add('active-state');
titleLabel.innerText = "Your Live Webcam Stream (Active)";
webcamBox.style.background = "linear-gradient(135deg, #1f4068, #162447)";
centerIcon.innerText = "📷";
centerIcon.style.transform = "scale(1.15)";
} else {
camBtn.innerText = "📹 Enable Camera";
camBtn.classList.remove('active-state');
titleLabel.innerText = "You (Webcam Off)";
webcamBox.style.background = "linear-gradient(45deg, #111214, #2b2d31)";
centerIcon.innerText = "👤";
centerIcon.style.transform = "scale(1)";
}
playSynthFrequency(520, 'triangle', 0.08, 0.1);
}
function toggleScreenShareState() {
isScreenSharing = !isScreenSharing;
const screenBtn = document.getElementById('screenshare-video-toggle');
const screenBox = document.getElementById('screenshare-canvas');
const shareLabel = document.getElementById('screenshare-label');
if (isScreenSharing) {
screenBtn.innerText = "🖥️ Stop Sharing";
screenBtn.classList.add('active-state');
shareLabel.innerText = "Display Monitor capture pipe is streaming live";
screenBox.style.background = "#0f3460";
screenBox.innerHTML = <div style="font-size: 20px; font-weight:600; color:#fff; z-index:1; text-shadow:0 2px 4px rgba(0,0,0,0.4)">📡 Streaming Window Monitor...</div>;
} else {
screenBtn.innerText = "🖥️ Share Screen";
screenBtn.classList.remove('active-state');
shareLabel.innerText = "Screen Share Stream Off";
screenBox.style.background = "#111115";
screenBox.innerHTML = <div style="font-size: 32px; z-index:1; opacity:0.25;">🖥️</div>;
}
playSynthFrequency(560, 'triangle', 0.08, 0.1);
}
/* Precision Chronometer Logic */
function initiateChronometerClock() {
elapsedCallSeconds = 0;
document.getElementById('call-duration-clock').innerText = "00:00";
callTimerInterval = setInterval(() => {
elapsedCallSeconds++;
let displayMinutes = String(Math.floor(elapsedCallSeconds / 60)).padStart(2, '0');
let displaySeconds = String(elapsedCallSeconds % 60).padStart(2, '0');
document.getElementById('call-duration-clock').innerText = ${displayMinutes}:${displaySeconds};
}, 1000);
}
function terminateChronometerClock() {
clearInterval(callTimerInterval);
elapsedCallSeconds = 0;
document.getElementById('call-duration-clock').innerText = "00:00";
}
